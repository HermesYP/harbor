name: Native Quality

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: native-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect native changes
        id: native-changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="${GITHUB_SHA}^1"
          elif [[ -z "${BASE_SHA:-}" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="$(git rev-list --max-parents=0 "$GITHUB_SHA")"
          fi

          if git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- \
            src-tauri \
            harbor-core \
            .github/workflows/native-quality.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip native check
        if: steps.native-changes.outputs.changed != 'true'
        run: echo "No native build inputs changed; skipping cargo check."

      - name: Install Linux build dependencies
        if: steps.native-changes.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libmpv-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Setup Rust
        if: steps.native-changes.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        if: steps.native-changes.outputs.changed == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            harbor-core
            src-tauri

      - name: Check Tauri application
        if: steps.native-changes.outputs.changed == 'true'
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Test Tauri application
        if: steps.native-changes.outputs.changed == 'true'
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
        run: cargo test --manifest-path src-tauri/Cargo.toml
